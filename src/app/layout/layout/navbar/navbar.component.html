<mat-nav-list>
  @for (item of navItemsByRole(); track item) {
    <a
      mat-list-item
      [routerLink]="item.url"
      [activated]="item.name === activeLink()"
      (click)="activeLink.set(item.name)"
      >{{ item.name }}</a
    >
  }
  <mat-list-item>
    <button matButton type="button" (click)="logout()">Logout</button>
  </mat-list-item>
</mat-nav-list>

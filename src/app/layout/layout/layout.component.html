<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    position="start"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
  >
    <app-navbar />
  </mat-sidenav>

  <mat-sidenav-content>
    @if (isMobile()) {
      <mat-toolbar class="mobile-bar">
        <button matIconButton type="button" aria-label="Open menu" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="mobile-title">MediBook</span>
      </mat-toolbar>
    }
    <main class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

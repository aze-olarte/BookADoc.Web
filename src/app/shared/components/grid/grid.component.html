<div class="table-wrapper">
  <div class="table-scroll">
    <table mat-table [dataSource]="dataSource" matSort>
      @for (column of columns(); track column.columnDef) {
        <ng-container [matColumnDef]="column.columnDef">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            {{ column.header }}
          </th>
          <td mat-cell *matCellDef="let row">
            @switch (column.type) {
              @default {
                {{ column.cell(row) }}
              }
            }
          </td>
        </ng-container>
      }

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          @if (actions().length) {
            <button matIconButton [matMenuTriggerFor]="menu" aria-label="Row actions">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              @for (action of rowActions().get(row); track action.type) {
                <button mat-menu-item (click)="onActionClick(action.type, row)">
                  <mat-icon>{{ action.icon }}</mat-icon>
                  <span>{{ action.label }}</span>
                </button>
              }
            </mat-menu>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="empty-cell" [attr.colspan]="displayedColumns().length">
          <div class="empty-state">
            <mat-icon class="empty-icon">inbox</mat-icon>
            <p class="empty-title">No results found</p>
          </div>
        </td>
      </tr>
    </table>
  </div>

  @if (dataSource.data.length) {
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" [pageSize]="10" showFirstLastButtons>
    </mat-paginator>
  }
</div>

<header class="page-header page-header--with-action">
  <div>
    <h1 class="title-lg">Appointments</h1>
  </div>
  @if (role === 'Admin') {
    <button matButton="filled" type="button" (click)="onGenerateReport()">
      <mat-icon matButtonIcon>add</mat-icon>
      Generate Report
    </button>
  }
  @if (role === 'Patient') {
    <button matButton="filled" (click)="onAddAppointment()">Book an Appointment</button>
  }
</header>

<app-grid
  [data]="data()"
  [columns]="columnDefs"
  [actions]="actions"
  (actionTriggered)="onActionTriggered($event)"
>
</app-grid>

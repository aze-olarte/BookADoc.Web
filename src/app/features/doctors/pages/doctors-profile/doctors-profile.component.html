<a mat-button class="back-link" [routerLink]="route">
  <mat-icon>arrow_back</mat-icon>
  Back to doctors
</a>

@if (doctor(); as d) {
  <article class="profile">
    <header class="profile-head">
      <div>
        <h1 class="title-lg">{{ d.name }}</h1>
        <p class="specialty">{{ d.specialization.name }}</p>
      </div>
    </header>

    <dl class="facts">
      <div>
        <dt>Specialization</dt>
        <dd>{{ d.specialization.name }}</dd>
      </div>
      <div>
        <dt>Consultation fee</dt>
        <dd>{{ d.consultationFee | currency: 'PHP' }}</dd>
      </div>
    </dl>

    <section class="about">
      <h2 class="title-sm">About</h2>
      <p class="bio">{{ d.bio || 'No bio provided.' }}</p>
    </section>
  </article>
} @else {
  <div class="loading">
    <mat-progress-spinner mode="indeterminate" diameter="32" />
  </div>
}

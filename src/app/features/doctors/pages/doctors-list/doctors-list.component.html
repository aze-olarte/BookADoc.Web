<mat-form-field appearance="outline">
  <mat-select [value]="selectedSpecialization()" (valueChange)="selectedSpecialization.set($event)">
    <mat-option [value]="0">All</mat-option>
    @for (option of specializationOptions(); track option.id) {
      <mat-option [value]="option.id">{{ option.name }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<mat-grid-list cols="4" rowHeight="2:1">
  @for (doctor of doctors(); track doctor.id) {
    <mat-grid-tile>
      <app-doctors-card [doctor]="doctor"></app-doctors-card>
    </mat-grid-tile>
  }
</mat-grid-list>

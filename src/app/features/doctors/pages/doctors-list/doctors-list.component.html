<header class="page-header">
  <h1 class="title-lg">Doctors</h1>
  <p>Browse our doctors and find the right specialist</p>
</header>

<div class="filters">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filter-field">
    <mat-label>Specialization</mat-label>
    <mat-select
      [value]="selectedSpecialization()"
      (valueChange)="selectedSpecialization.set($event)"
    >
      <mat-option [value]="0">All</mat-option>
      @for (option of specializationOptions(); track option.id) {
        <mat-option [value]="option.id">{{ option.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>

<app-grid
  [data]="doctors()"
  [columns]="columnDefs"
  [actions]="actions"
  (actionTriggered)="onActionTriggered($event)"
>
</app-grid>

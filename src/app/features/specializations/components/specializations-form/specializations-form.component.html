<h2 mat-dialog-title>Add specialization</h2>

<mat-dialog-content>
  <form [formGroup]="fg" (ngSubmit)="save()" class="form" id="specialization-form">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required />
      @if (f.name.hasError('required') && (f.name.dirty || f.name.touched)) {
        <mat-error>Name is required.</mat-error>
      }
      @if (f.name.hasError('serverError')) {
        <mat-error>{{ f.name.errors?.['serverError'] }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button mat-flat-button type="submit" form="specialization-form">Save</button>
</mat-dialog-actions>

<h2 mat-dialog-title>Add Specialization</h2>
<mat-dialog-content>
  <form [formGroup]="fg" class="form">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required />
      @if (f.name.hasError('required') && (f.name.dirty || f.name.touched)) {
        <mat-error>Name is required.</mat-error>
      }

      @if (f.name.hasError('serverError')) {
        <mat-error>{{ f.name.errors?.['serverError'] }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button (click)="save()">Save</button>
</mat-dialog-actions>

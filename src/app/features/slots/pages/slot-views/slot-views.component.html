<h1>Slots</h1>

<mat-button-toggle-group
  name="viewType"
  aria-label="View Type"
  [value]="currentView()"
  (change)="onViewChange($event)"
>
  <mat-button-toggle value="list">List</mat-button-toggle>
  <mat-button-toggle value="calendar">Calendar</mat-button-toggle>
</mat-button-toggle-group>

@if (currentView() === 'list') {
  <app-slot-list #slotList [id]="doctorId()" (emitUpdate)="onUpdate()"> </app-slot-list>
} @else {}

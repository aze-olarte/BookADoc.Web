<header class="page-header page-header--with-action">
  <div>
    <h1 class="title-lg">Slots</h1>
    <p>Manage the time slots available for booking</p>
  </div>

  <mat-button-toggle-group
    class="view-toggle"
    name="viewType"
    aria-label="View type"
    hideSingleSelectionIndicator
    [value]="currentView()"
    (change)="onViewChange($event)"
  >
    <mat-button-toggle value="list">List</mat-button-toggle>
    <mat-button-toggle value="calendar">Calendar</mat-button-toggle>
  </mat-button-toggle-group>
</header>

@if (currentView() === 'list') {
  <app-slot-list
    #slotList
    [id]="doctorId()"
    (emitUpdate)="onUpdate($event)"
    (emitDelete)="onDelete($event)"
  >
  </app-slot-list>
} @else {
  <app-slot-calendar
    #slotCalendar
    [id]="doctorId()"
    (emitClick)="onUpdate($event)"
  ></app-slot-calendar>
}

<header class="page-header">
  <h1 class="title-lg">Welcome back, {{ name() }}</h1>
  <p>{{ content().intro }}</p>
</header>

<nav class="cards">
  @for (action of content().actions; track action.url) {
    <a class="surface-card card" [routerLink]="action.url">
      <mat-icon>{{ action.icon }}</mat-icon>
      <div>
        <div class="card-title">{{ action.label }}</div>
        <div class="card-text">{{ action.description }}</div>
      </div>
    </a>
  }
</nav>
